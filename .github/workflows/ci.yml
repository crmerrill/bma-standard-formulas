name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        extras: ["", "git"]

    name: test (${{ matrix.python-version }}, ${{ matrix.extras == '' && 'no-pygit2' || 'pygit2' }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify git CLI available
        run: git --version

      - name: Install package with dev dependencies
        if: matrix.extras == ''
        run: pip install -e ".[dev]"

      - name: Install package with dev + git dependencies
        if: matrix.extras == 'git'
        run: pip install -e ".[dev,git]"

      - name: Run tests
        run: python -m pytest tests/ -v
