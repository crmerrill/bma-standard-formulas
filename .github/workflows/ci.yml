name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        extras: ["", "git"]

    name: test (${{ matrix.python-version }}, ${{ matrix.extras == '' && 'no-pygit2' || 'pygit2' }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify git CLI available
        run: git --version

      - name: Install package with dev dependencies
        if: matrix.extras == ''
        run: pip install -e ".[dev]"

      - name: Install package with dev + git dependencies
        if: matrix.extras == 'git'
        run: pip install -e ".[dev,git]"

      - name: Check field_order.json drift
        run: python scripts/emit_field_order.py --check

      - name: Check canonical fixtures drift
        run: python scripts/emit_canonical_fixtures.py --check

      - name: Check vendored field_order.json parity
        run: diff -q src/bma_standard_formulas/deals/schemas/field_order.json src/bma_cfengine_app/ui/src/features/deals/field_order.json

      - name: Diagnostic catalog parity check
        run: python -m bma_standard_formulas.diagnostics.check

      - name: Run tests
        run: python -m pytest tests/ -v

  slow-bench:
    runs-on: ubuntu-latest
    # Run benchmarks on PRs and main-branch pushes but do NOT gate the merge
    # on timing — CI hardware variance can cause spurious failures.  The job
    # is informational for regressions; a manual re-run or local measurement
    # is the authoritative gate.  If the budget assertions start flapping
    # consistently, set `continue-on-error: false` here.
    continue-on-error: true
    strategy:
      matrix:
        python-version: ["3.12"]

    name: slow-bench (performance, ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run slow performance benchmarks
        run: python -m pytest -m slow tests/performance/ -v --tb=short

  ui-test:
    runs-on: ubuntu-latest
    name: ui-test (vitest)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install UI dependencies
        working-directory: src/bma_cfengine_app/ui
        run: npm install

      - name: Run Vitest
        working-directory: src/bma_cfengine_app/ui
        run: npx vitest run
