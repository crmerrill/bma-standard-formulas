[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bma-standard-formulas"
version = "0.5.0"
description = "BMA Standard Formulas for mortgage cash flows, prepayments, and defaults"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.12"
authors = [
    { name = "Daniel Akiva" },
    { name = "Idriss Maoui" },
    { name = "Charles R. Merrill" },
]
keywords = ["bma", "mortgage", "cashflow", "prepayment", "default", "standard-formulas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "openpyxl",
    "pydantic",
]

[project.optional-dependencies]
# JIT-compiled cashflow loops (significant speedup for large portfolios)
numba = ["numba>=0.59"]
# FRED rate data access via RateIndex.from_fred()
fred = ["pandas-datareader>=0.10"]
# libgit2 bindings for fast in-process git operations (CLI fallback used when absent)
git = ["pygit2>=1.15"]
# All optional runtime extras
all = ["numba>=0.59", "pandas-datareader>=0.10", "pygit2>=1.15"]
# Web app (FastAPI + UI)
app = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "python-multipart>=0.0.20"]
# Development / testing
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.28"]

[project.urls]
Repository = "https://github.com/crmerrill/bma-standard-formulas"
Documentation = "https://github.com/crmerrill/bma-standard-formulas#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
